{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-4 fw-bold text-primary">Iniciar Sesión</h3>
            <form action="{{ url_for('auth.login') }}" method="POST" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="nombre@correo.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar al Sistema</button>
            </form>
            <div class="text-center mt-3">
                <small>¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
