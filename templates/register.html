{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-4 fw-bold text-success">Crear Cuenta</h3>
            <form action="{{ url_for('auth.register') }}" method="POST" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej. juan123" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="juan@correo.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Crea una contraseña segura" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Registrarme</button>
            </form>
            <div class="text-center mt-3">
                <small>¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
